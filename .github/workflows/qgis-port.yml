name: QGIS port tests
on:
  push:
    paths: ['LETO_qgis_project/**', '.github/workflows/qgis-port.yml']
  pull_request:
    paths: ['LETO_qgis_project/**', '.github/workflows/qgis-port.yml']
permissions:
  contents: read
jobs:
  qgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install system QGIS and scientific Python
        run: |
          timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          timeout 600 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-qgis python3-scipy python3-pandas python3-pytest python3-xlrd
      - name: Test real PyQGIS and preserved scientific functions
        working-directory: LETO_qgis_project
        run: |
          /usr/bin/python3 run_leto.py --check-runtime
          /usr/bin/python3 -m pytest -q
